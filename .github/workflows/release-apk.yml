name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using custom GitHub repository secret for signing."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"
          elif [ -f "$GITHUB_WORKSPACE/keystore/release.jks" ]; then
            echo "Using bundled release keystore for automatic signing (zero manual setup required)."
            echo "SIGNING_STORE_PASSWORD=fieldnotes123" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=fieldnotes" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=fieldnotes123" >> "$GITHUB_ENV"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore/release.jks" >> "$GITHUB_ENV"
          else
            echo "No secrets or bundled keystore found. Generating automatic release keystore (zero setup required)..."
            mkdir -p "$GITHUB_WORKSPACE/keystore"
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/keystore/release.jks" \
              -alias fieldnotes \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass fieldnotes123 \
              -keypass fieldnotes123 \
              -dname "CN=Fieldnotes, OU=Apps, O=Fieldnotes, L=City, ST=State, C=US"
            echo "SIGNING_STORE_PASSWORD=fieldnotes123" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=fieldnotes" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=fieldnotes123" >> "$GITHUB_ENV"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Compute Version Metadata
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          UTC_DATE=$(date -u +"%Y.%m.%d")
          VERSION_NAME="${UTC_DATE}-${RUN_NUM}"
          VERSION_CODE="${RUN_NUM}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "utc_date=$UTC_DATE" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
        run: |
          ./gradlew :app:assembleRelease \
            -PVERSION_CODE="${{ steps.versioning.outputs.version_code }}" \
            -PVERSION_NAME="${{ steps.versioning.outputs.version_name }}" \
            --no-daemon

      - name: Prepare Release Artifact
        id: prepare_artifact
        run: |
          VERSION_NAME="${{ steps.versioning.outputs.version_name }}"
          VERSION_CODE="${{ steps.versioning.outputs.version_code }}"
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_DEST="app/build/outputs/apk/release/fieldnotes-${VERSION_NAME}-vc${VERSION_CODE}.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_DEST"
          else
            FOUND_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            cp "$FOUND_APK" "$APK_DEST"
          fi
          echo "apk_path=$APK_DEST" >> "$GITHUB_OUTPUT"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fieldnotes-${{ steps.versioning.outputs.version_name }}-vc${{ steps.versioning.outputs.version_code }}
          path: ${{ steps.prepare_artifact.outputs.apk_path }}
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versioning.outputs.version_name }}
          name: Fieldnotes ${{ steps.versioning.outputs.version_name }}
          body: |
            ### Fieldnotes Release ${{ steps.versioning.outputs.version_name }}

            - **Release Date (UTC)**: ${{ steps.versioning.outputs.utc_date }}
            - **Commit SHA**: ${{ github.sha }}
            - **versionCode**: ${{ steps.versioning.outputs.version_code }}

            > **Notice**: Install this APK over the existing app; do not uninstall.
          files: ${{ steps.prepare_artifact.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
