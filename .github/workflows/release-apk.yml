name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Validate Signing Secrets and Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing or empty. Add it in GitHub: Settings -> Secrets and variables -> Actions. See RELEASE.md."
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Secret STORE_PASSWORD is missing or empty. Add it in GitHub: Settings -> Secrets and variables -> Actions. See RELEASE.md."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Secret KEY_ALIAS is missing or empty. Add it in GitHub: Settings -> Secrets and variables -> Actions. See RELEASE.md."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secret KEY_PASSWORD is missing or empty. Add it in GitHub: Settings -> Secrets and variables -> Actions. See RELEASE.md."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"
          if [ ! -s "$GITHUB_WORKSPACE/release.jks" ]; then
            echo "::error::Decoded release.jks is empty or failed to decode."
            exit 1
          fi

      - name: Compute Version Metadata
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          UTC_DATE=$(date -u +"%Y.%m.%d")
          VERSION_NAME="${UTC_DATE}-${RUN_NUM}"
          VERSION_CODE="${RUN_NUM}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "utc_date=$UTC_DATE" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
        run: |
          chmod +x gradlew || true
          ./gradlew :app:assembleRelease \
            -PVERSION_CODE="${{ steps.versioning.outputs.version_code }}" \
            -PVERSION_NAME="${{ steps.versioning.outputs.version_name }}" \
            --no-daemon

      - name: Prepare Release Artifact
        id: prepare_artifact
        run: |
          VERSION_NAME="${{ steps.versioning.outputs.version_name }}"
          VERSION_CODE="${{ steps.versioning.outputs.version_code }}"
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_DEST="app/build/outputs/apk/release/fieldnotes-${VERSION_NAME}-vc${VERSION_CODE}.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_DEST"
          else
            FOUND_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            cp "$FOUND_APK" "$APK_DEST"
          fi
          echo "apk_path=$APK_DEST" >> "$GITHUB_OUTPUT"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fieldnotes-${{ steps.versioning.outputs.version_name }}-vc${{ steps.versioning.outputs.version_code }}
          path: ${{ steps.prepare_artifact.outputs.apk_path }}
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versioning.outputs.version_name }}
          name: Fieldnotes ${{ steps.versioning.outputs.version_name }}
          body: |
            ### Fieldnotes Release ${{ steps.versioning.outputs.version_name }}

            - **Release Date (UTC)**: ${{ steps.versioning.outputs.utc_date }}
            - **Commit SHA**: ${{ github.sha }}
            - **versionCode**: ${{ steps.versioning.outputs.version_code }}

            > **Notice**: Install this APK over the existing app; do not uninstall.
          files: ${{ steps.prepare_artifact.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
