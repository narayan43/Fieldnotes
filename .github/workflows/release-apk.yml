name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Compute Version Metadata
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          VERSION_CODE=$((100 + RUN_NUM))
          UTC_DATE=$(date -u +"%Y.%m.%d")
          VERSION_NAME="${UTC_DATE}-${RUN_NUM}"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "utc_date=$UTC_DATE" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            -PVERSION_CODE="${{ steps.versioning.outputs.version_code }}" \
            -PVERSION_NAME="${{ steps.versioning.outputs.version_name }}" \
            --no-daemon

      - name: Verify APK exists
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::APK not found at app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

      - name: Prepare APK for Release
        id: prepare_apk
        run: |
          VERSION_NAME="${{ steps.versioning.outputs.version_name }}"
          VERSION_CODE="${{ steps.versioning.outputs.version_code }}"
          DEST_APK="app/build/outputs/apk/debug/fieldnotes-${VERSION_NAME}-vc${VERSION_CODE}.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_APK"
          echo "apk_path=$DEST_APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fieldnotes-${{ steps.versioning.outputs.version_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versioning.outputs.version_name }}
          name: Fieldnotes ${{ steps.versioning.outputs.version_name }}
          body: |
            ### Fieldnotes Release ${{ steps.versioning.outputs.version_name }}

            - **Version Code**: ${{ steps.versioning.outputs.version_code }}
            - **Release Date (UTC)**: ${{ steps.versioning.outputs.utc_date }}
            - **Commit SHA**: ${{ github.sha }}

            > **Notice**: Install over the existing app; do not uninstall.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.prepare_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
